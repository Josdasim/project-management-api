[project]
name = "project-management-api"
version = "0.1.0"
description = "API de gestion de proyectos"
readme = "README.md"
requires-python = ">=3.14"

# Las dependencias estan en los archivos "requirements.txt" y "requirements-dev.txt"

# Ubicacion del codigo fuente
[tool.setuptools.packages.find]
where = ["src"]

# Configuraciones de ruff
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src","."]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = ["E501"]
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/models_registry.py" = ["F401"]
"alembic/env.py" =["F401", "E402"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Security",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]